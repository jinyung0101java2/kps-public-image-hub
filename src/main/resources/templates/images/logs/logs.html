<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layouts/layout}">
<div layout:fragment="content" class="article">
	<div id="content" class="sub-page">
		<article class="location">
			<ul>
				<li><a onclick="movePage(URI_CP_BASE_URL)">Images</a></li>
				<li><a onclick="movePage(URI_KPS_HUB_IMAGE_PROJECT)">Projects</a></li>
			</ul>
			<ul class="title">
				<span id="title"></span>
			</ul>
		</article>
		<article>
			<fieldset>
				<ul style="display: flex; float: right;">
					<li>
						<div class="statistics">
							<h3 class="stat-title">Total Images</h3>
							<div class="stat-box">
								<i class="fa-solid fa-file fa-2xl stat-img"></i>
								<div id="total-images" class="total-cnt"></div>
							</div>
						</div>
					</li>
					<li>
						<div class="statistics">
							<h3 class="stat-title">Total Artifacts</h3>
							<div class="stat-box">
								<i class="fa-solid fa-box-archive fa-2xl stat-img"></i>
								<div id="total-artifacts" class="total-cnt"></div>
							</div>
						</div>
					</li>
					<li>
						<div class="statistics">
							<h3 class="stat-title">Total Pulls</h3>
							<div class="stat-box">
								<i class="fa-solid fa-download fa-2xl stat-img"></i>
								<div id="total-pulls" class="total-cnt"></div>
							</div>
						</div>
					</li>
					<li>
						<div class="statistics">
							<h3 class="stat-title">Storage Used</h3>
							<div class="stat-box">
								<i class="fa-solid fa-database fa-2xl stat-img"></i>
								<div id="total-storages" class="total-cnt"></div>
							</div>
						</div>
					</li>
					<li>
						<div class="last-statistics">
							<h3 class="stat-title">Total Vulnerabilities</h3>
							<div class="stat-box">
								<i class="fa-solid fa-shield-halved fa-2xl stat-img"></i>
								<div id="total-vulnerabilities" class="total-cnt"></div>
							</div>
						</div>
					</li>
				</ul>
			</fieldset>
		</article>
		<article class="base-pro base tab-cont-wrap">

			<div class="notice">
				<ul class="tab-btn">
					<li type="repository"><a onclick="movePage(URI_KPS_HUB_IMAGE_REPOSITORY)" th:text="#{M0940}"></a></li>
					<li type="vulnerability"><a onclick="movePage(URI_KPS_HUB_IMAGE_VULNERABILITY)" th:text="#{M0955}"></a></li>
					<li type="log" class="active"><a th:text="#{M0941}"></a></li>
				</ul>
				<div class="table_style01">
					<table>
						<caption>Logs List</caption>
						<colgroup >
							<col width="20%" />
							<col width="44%" />
							<col width="12%" />
							<col width="12%" />
							<col width="12%" />
						</colgroup>
						<thead>
						<tr>
							<th scope="col">Username</th>
							<th scope="col">Resource</th>
							<th scope="col">Resource Type</th>
							<th scope="col">Operation</th>
							<th scope="col">Timestamp</th>
						</tr>
						</thead>
						<tbody class="listTable">
						</tbody>
						<!--<tfoot>
						<tr>
							<td colspan="5">
								<i id="angles-left-end" class="fa-solid fa-angles-left" style="cursor: pointer; margin: 0 5px 0 5px;"></i>
								<i id="angle-left" class="fa-solid fa-angle-left" style="cursor: pointer; margin: 0 5px 0 5px;"></i>
								<span id="page-start" style="margin: 0 5px 0 5px;"></span><span>/</span><span id="page-end" style="margin: 0 5px 0 5px;"></span>
								<i id="angle-right" class="fa-solid fa-angle-right" style="cursor: pointer; margin: 0 5px 0 5px;"></i>
								<i id="angles-right-end" class="fa-solid fa-angles-right" style="cursor: pointer; margin: 0 5px 0 5px;"></i>
							</td>
						</tr>
						</tfoot>-->
					</table>
				</div>
			</div>
		</article>
	</div>
</div>
<th:block layout:fragment="script">
	<script type="text/javascript">
		window.onload = () => {

			IS_GLOBAL = true;
			func.init(ASIDE_DP1.IMAGES, ASIDE_DP2.PROJECTS);

			const logs = {
				limit: 15,
				page: 1,
				pageStart: 1,
				pageEnd: 0,
				type: 'administrator',

				init() {
					func.nameLoad = logs.reset;
					document.getElementById('title').innerHTML = sessionStorage.getItem('repositoryName');

					logs.load();

					logs.event();
				},

				reset() {
					func.removeHtml(document.querySelector('.listTable'));
					logs.offset = 0;
					logs.load();
				},

				load() {
					func.loading();

					if (sessionStorage.getItem('repositoriesCnt') > 0) {
						func.loadHarborData('GET', `${func.harborUrl}api/v2.0/projects/${sessionStorage.getItem('repositoryName')}/auditlog-exts?page=1&page_size=-1`, 'application/json', logs.drawLogs);
						//func.loadHarborData('GET', `${func.harborUrl}api/v2.0/projects/${sessionStorage.getItem('repositoryName')}/logs?page_size=${logs.limit}&page=${logs.page}`, 'application/json', logs.drawLogs);
						func.loadHarborData('GET', `${func.harborUrl}api/v2.0/projects/${sessionStorage.getItem('repositoryName')}/repositories?page=1&page_size=-1`, 'application/json', logs.drawRepositories);
						func.loadHarborData('GET', `${func.harborUrl}api/v2.0/projects`, 'application/json', logs.drawStorage);
						func.loadHarborData('GET', `${func.harborUrl}api/v2.0/projects/${sessionStorage.getItem('repositoryId')}/summary`, 'application/json', logs.drawPage);
					} else if (sessionStorage.getItem('repositoriesCnt') == 0) {

						document.getElementById('total-images').innerText = '0';
						document.getElementById('total-artifacts').innerText = '0';
						document.getElementById('total-pulls').innerText = '0';
						document.getElementById('total-storages').innerText = '0 Byte';
						document.getElementById('total-vulnerabilities').innerText = sessionStorage.getItem('cveCnt');

						let html = '<tr><td colspan="5">No Data.</td></tr>';
						func.appendHtml(document.querySelector('.listTable'), html, 'tbody');

						if (document.getElementById('loading')) {
							document.getElementById('wrap').removeChild(document.getElementById('loading'));
						}
					}
				},

				drawLogs(data) {

					let html;
					sessionStorage.setItem('logsCnt', data.length);
					if (data.length > 0) {
						for (var i = 0; i <= data.length - 1; i++) {

							let time = func.changeTime(data[i].op_time)

							html = `<tr>
                                        <td>${data[i].username}</td>
                                        <td class="left">${data[i].resource}</td>
                                        <td>${data[i].resource_type}</td>
                                        <td>${data[i].operation}</td>
                                        <td id="time_${i}">time</td>
                                    </tr>`;
							func.appendHtml(document.querySelector('.listTable'), html, 'tbody');

							document.getElementById("time_" + i).innerText = time;

						}
					} else if (data.length === 0) {
						let html = '<tr><td colspan="5">No Data.</td></tr>';
						func.appendHtml(document.querySelector('.listTable'), html, 'tbody');
					}

					if (document.getElementById('loading')) {
						document.getElementById('wrap').removeChild(document.getElementById('loading'));
					}

				},

				drawRepositories(data) {

					let totalImages = data.length;
					let totalArtifacts = 0;
					let totalPulls = 0;

					document.getElementById('total-images').innerText = totalImages;
					if (data.length > 0) {
						for (var i = 0; i <= data.length - 1; i++) {

							totalArtifacts += data[i].artifact_count;
							totalPulls += data[i].pull_count;

						}
					}

					document.getElementById('total-artifacts').innerText = totalArtifacts
					document.getElementById('total-pulls').innerText = totalPulls

					if (document.getElementById('loading')) {
						document.getElementById('wrap').removeChild(document.getElementById('loading'));
					}

				},

				drawPage(data) {
					document.getElementById('total-storages').innerText = func.formatBytes(data.quota.used.storage);
					// document.getElementById('total-images').innerText = data.repo_count;
					document.getElementById('total-vulnerabilities').innerText = sessionStorage.getItem('cveCnt');

					// document.getElementById('page-start').innerText = logs.page;
					// document.getElementById('page-end').innerText = data.project_admin_count;
				},

				drawStorage(data) {

					for (var i = 0; i <= data.length - 1; i++) {
						if(data[i].name === sessionStorage.getItem('repositoryName')) {
							func.loadHarborData('GET', `${func.harborUrl}api/v2.0/projects/${data[i].project_id}/summary`, 'application/json', (e) => {
								document.getElementById('total-storages').innerText = func.formatBytes(e.quota.used.storage)
							});
						}
					}

				},

				event(){

					// document.querySelector('#angles-left-end').addEventListener('click', () => {
					//
					// 	func.loadHarborData('GET', `${func.harborUrl}api/v2.0/projects/${sessionStorage.getItem('repositoryName')}/logs?page_size=${logs.limit}&page=${logs.pageStart}`, 'application/json', logs.drawRepositories);
					// 	document.getElementById('page-start').innerText = logs.pageStart;
					// 	logs.page = logs.pageStart;
					// }, false);
					//
					// document.querySelector('#angle-left').addEventListener('click', () => {
					// 	if (logs.page > 1) {
					// 		logs.page -= 1;
					// 	} else if (logs.page == 1) {
					// 		logs.page = logs.pageStart
					// 	}
					//
					// 	func.loadHarborData('GET', `${func.harborUrl}api/v2.0/projects/${sessionStorage.getItem('repositoryName')}/logs?page_size=${logs.limit}&page=${logs.page}`, 'application/json', logs.drawRepositories);
					// 	document.getElementById('page-start').innerText = logs.page;
					// }, false);
					//
					// document.querySelector('#angle-right').addEventListener('click', () => {
					// 	if (logs.page < logs.pageEnd) {
					// 		logs.page += 1;
					// 	} else if (logs.page == logs.pageEnd) {
					// 		logs.page = logs.pageEnd
					// 	}
					//
					// 	func.loadHarborData('GET', `${func.harborUrl}api/v2.0/projects/${sessionStorage.getItem('repositoryName')}/logs?page_size=${logs.limit}&page=${logs.page}`, 'application/json', logs.drawRepositories);
					// 	document.getElementById('page-start').innerText = logs.page;
					// }, false);
					//
					// document.querySelector('#angles-right-end').addEventListener('click', () => {
					// 	func.loadHarborData('GET', `${func.harborUrl}api/v2.0/projects/${sessionStorage.getItem('repositoryName')}/logs?page_size=${logs.limit}&page=${logs.pageEnd}`, 'application/json', logs.drawRepositories);
					// 	document.getElementById('page-start').innerText = logs.pageEnd;
					// 	logs.page = logs.pageEnd;
					// }, false);

				},

			};

			logs.init();
		}
	</script>
</th:block>
</html>
